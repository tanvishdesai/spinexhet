base_config: ../base.yaml
experiment_name: baseline_concept_prototype_no_residual

model:
  type: spinexnet
  backbone: convnext_tiny
  pretrained: true
  num_concepts: 15
  num_classes: 3
  num_prototypes: 50
  meta_dim: 16
  hidden_dim: 256
  dropout: 0.2
  prototype_temperature: 0.25
  residual_features: false
  residual_dim: 128
  ordinal: true

