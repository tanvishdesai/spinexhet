base_config: base.yaml
experiment_name: spinexnet_fast_v3

data:
  image_size: 160

training:
  epochs: 15
  batch_size: 16
  val_batch_size: 16
  grad_accum: 2
  num_workers: 2
  warmup_epochs: 1
  early_stopping_patience: 6
  max_val_batches: 250
  validate_every: 1
  checkpoint_every_steps: 250
  checkpoint_every_minutes: 15.0
  heartbeat_every_steps: 100
  heartbeat_every_minutes: 5.0
  time_limit_minutes: 650
  lr: 0.001
  backbone_lr: 0.0001
  concept_head_lr: 0.003
  weight_decay: 0.03

loss:
  classification: 1.0
  concept: 1.0
  prototype_cluster: 0.1
  prototype_diversity: 0.05
  ordinal: 0.2
  label_smoothing: 0.1

model:
  type: spinexnet
  backbone: convnext_tiny
  pretrained: true
  num_classes: 3
  num_concepts: 5
  num_prototypes: 20
  meta_dim: 16
  hidden_dim: 256
  dropout: 0.3
  prototype_temperature: 1.0
  residual_features: true
  residual_dim: 128
  ordinal: true
  residual_warmup_epochs: 0


