base_config: ../base.yaml
experiment_name: baseline_deit_small

model:
  type: baseline
  backbone: deit_small_patch16_224
  pretrained: true
  num_classes: 3
  meta_dim: 16
  hidden_dim: 256
  dropout: 0.2
  ordinal: true

training:
  epochs: 25
  batch_size: 16
  val_batch_size: 16
  grad_accum: 2
  warmup_epochs: 5
  early_stopping_patience: 10
  lr: 0.001
  backbone_lr: 0.00005
  weight_decay: 0.01

loss:
  class_weights: auto
  classification: 1.0
  concept: 0.0
  prototype_cluster: 0.0
  prototype_diversity: 0.0
  ordinal: 0.2
