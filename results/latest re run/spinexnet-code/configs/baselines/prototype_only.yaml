base_config: ../base.yaml
experiment_name: baseline_prototype_only

data:
  concept_columns: []

model:
  type: spinexnet
  backbone: convnext_tiny
  pretrained: true
  num_concepts: 0
  num_classes: 3
  num_prototypes: 50
  meta_dim: 16
  hidden_dim: 256
  dropout: 0.2
  prototype_temperature: 0.25
  residual_features: false
  residual_dim: 128
  ordinal: true

loss:
  class_weights: auto
  classification: 1.0
  concept: 0.0
  prototype_cluster: 0.05
  prototype_diversity: 0.02
  ordinal: 0.2

