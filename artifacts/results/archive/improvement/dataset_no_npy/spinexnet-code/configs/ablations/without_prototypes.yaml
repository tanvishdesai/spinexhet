base_config: ../spinexnet.yaml
experiment_name: ablation_without_prototypes

model:
  type: spinexnet
  backbone: convnext_tiny
  pretrained: true
  num_concepts: 15
  num_classes: 3
  num_prototypes: 0
  meta_dim: 16
  hidden_dim: 256
  dropout: 0.2
  prototype_temperature: 0.25
  residual_features: true
  residual_dim: 128
  ordinal: true

loss:
  prototype_cluster: 0.0
  prototype_diversity: 0.0

